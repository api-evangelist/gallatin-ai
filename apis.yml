name: Gallatin AI
description: Gallatin AI builds AI-powered software for defense logistics, giving military
  planners and logisticians decision advantage across the tactical, operational, and
  strategic levels of the supply chain. Its products include Navigator, an AI decision-support
  "S4" that aggregates and analyzes brigade-level logistics reports in real time to
  streamline resupply planning; Burrow, a DoD-compliant third-party logistics (3PL)
  solution managing vendor qualification, transportation, inventory, storage, and fulfillment
  for domestic and international operations; and Phalanx, an automated asset and in-transit
  visibility system combining traditional reporting with hardware sensors and computer
  vision. Founded by veterans of Scale AI, Palantir, Amazon Prime Air, and the DoD, the
  company emerged from stealth in 2025 and is backed by 8VC, Silent Ventures, Timeless,
  Moonshots Capital, and Banter Capital.
